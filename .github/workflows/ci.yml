# Runs the backend test suite and the frontend type check on every pull
# request, so a change is proven before it reaches main (main auto-deploys
# to Render and Cloudflare Pages). Added 2026-11-23 with the sign-in email
# fixes, which were written where the suite could not be run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", "src/**", "package*.json", "tsconfig.json", ".github/workflows/ci.yml"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Run the tests (one more try only if the test process crashes)
        # mini-racer (the V8 engine the simulator tests use) can segfault
        # while the suite creates and closes many engines: on 2026-11-24 one
        # run crashed that way (exit 139) on a commit that changed no backend
        # code. A crash gets one more run; a failing test never does.
        run: |
          python -m pytest -q -p no:cacheprovider || {
            code=$?
            if [ "$code" -eq 139 ]; then
              echo "::warning::The test process crashed (segfault, exit 139); running the suite once more"
              python -m pytest -q -p no:cacheprovider
            else
              exit "$code"
            fi
          }

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
