# Runs the backend test suite and the frontend type check on every pull
# request, so a change is proven before it reaches main (main auto-deploys
# to Render and Cloudflare Pages). Added 2026-11-23 with the sign-in email
# fixes, which were written where the suite could not be run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", "src/**", "package*.json", "tsconfig.json", ".github/workflows/ci.yml"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
